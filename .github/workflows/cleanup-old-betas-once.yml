name: One-time cleanup of merged branches and old beta releases

on:
  push:
    branches: [rts-development]
    paths:
      - '.github/workflows/cleanup-old-betas-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate exact targets, then remove only old merged branches and releases
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "arnip4-hub/RTS-gangster-1-" ]] || { echo "Unexpected repository"; exit 1; }
          [[ "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')" == "rts-development" ]] || { echo "Default branch changed"; exit 1; }

          branch_rows=(
            'branding/windows-rts-installer-20261122|018922ce1cd59c44bc41562f8eb541db02322f0a|2'
            'graphics/illustrated-2d-characters-design-20261123|660389e3c6c48971881e76f089e36fac3e31dcbc|8'
            'graphics/illustrated-layered-pilot-20261123|dc45d904b535488247978dc8aebc9afb0313b778|9'
            'maintenance/rts-standalone-cleanup-20261122|ce8a50a1a2778583963be3263e4bf9af290d2577|1'
            'release/rts-beta-20261122-1|e8942054340ff595e3e126e964f118f7f85d9947|6'
            'release/rts-beta-20261123-1|6f62bed34ea1b40e6455e1635a59beec2be4fd00|7'
            'ui/building-to-hood-dispatch-20261122|4336ac8aa184d519c9ca236b52791ec7577ee3be|5'
            'ui/complete-hood-command-bar-20261122|792bcc7a5f4d91708a8a7b6a5ca35c35c77cc818|4'
            'ui/enable-layered-pilot-option-20261123|dfc4c8f1071c82f996a38d8a5be6d6572d9d2c5c|10'
            'ui/hood-command-bar-from-work-20261122|025e8d427716d5be65d763dda5a27e075500616c|3'
          )
          release_rows=(
            'rts-vehicles-20261121.1|453672216'
            'rts-beta-20261118.4|450632939'
            'rts-beta-20261118.3|450604491'
            'rts-beta-20261118.2|450534023'
            'rts-beta-20261118.1|450407510'
            'rts-beta-20261117.2|449300194'
            'rts-beta-20261117.1|448289923'
          )

          echo "Preflight: verify newest three beta releases remain present."
          for tag in rts-beta-20261123.2 rts-beta-20261123.1 rts-beta-20261122.1; do
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null
          done

          echo "Preflight: verify every branch has unchanged SHA and a merged pull request."
          for entry in "${branch_rows[@]}"; do
            IFS='|' read -r branch expected pr <<< "$entry"
            current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq .object.sha)"
            read -r merged source prsha < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '[.merged_at, .head.ref, .head.sha] | @tsv')
            if [[ "$current" != "$expected" || "$source" != "$branch" || "$prsha" != "$expected" || "$merged" == "null" || -z "$merged" ]]; then
              echo "Unsafe: $branch differs from merged PR #$pr; stopping before deletion."
              exit 1
            fi
          done

          echo "Preflight: verify release IDs still match their original tag."
          for entry in "${release_rows[@]}"; do
            IFS='|' read -r tag id <<< "$entry"
            current="$(gh api "repos/$GITHUB_REPOSITORY/releases/$id" --jq .tag_name)"
            [[ "$current" == "$tag" ]] || { echo "Release $id changed; stopping before deletion."; exit 1; }
          done

          echo "All preflight checks passed. Deleting only ten merged feature branches."
          for entry in "${branch_rows[@]}"; do
            IFS='|' read -r branch expected pr <<< "$entry"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null
            echo "Deleted branch: $branch"
          done

          echo "Deleting releases beta.1 through beta.7 while retaining their Git tags."
          for entry in "${release_rows[@]}"; do
            IFS='|' read -r tag id <<< "$entry"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" >/dev/null
            echo "Deleted release: $tag (Git tag retained)"
          done

          echo "Done: default branch, work, illustrated-vehicles and beta.8-10 releases preserved."
