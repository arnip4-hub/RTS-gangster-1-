name: Windows beta build and tests

on:
  pull_request:
    branches: [rts-development]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Blank: artifact only; rts-beta-20261128.1: publish after Windows smoke test'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Validate publishing request
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/rts-development' -or $env:TAG -ne 'rts-beta-20261128.1') {
            throw 'Publishing requires rts-development and the beta.12 tag'
          }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci


      - name: Check targeting, pricing, skills, map and calendar regressions
        run: npx vitest run tests/target-owner-privacy.test.ts tests/upstream-pricing.test.ts tests/order-skills.test.ts tests/person-names.test.ts tests/map-intel.test.ts tests/planning-selection.test.ts tests/building-outline.test.ts tests/combat-weapons.test.ts tests/order-staffing.test.ts tests/calendar-modes.test.ts tests/continuous-week.test.ts tests/week-scheduling.test.ts tests/hood-selection.test.ts tests/building-dispatch.test.ts tests/building-actions.test.ts tests/week-quick-navigation.test.ts tests/street-guard-patrol.test.ts tests/vehicle-sprites.test.ts tests/illustrated-people.test.ts tests/character-wardrobe.test.ts tests/illustrated-character-spec.test.ts tests/layered-pilot.test.ts tests/layered-pilot-option.test.ts

      - name: Check RTS investigations, custody, hearings and save compatibility
        run: npx vitest run tests/rts-police-core.test.ts tests/rts-witness-statements.test.ts tests/rts-fbi-cases.test.ts tests/rts-gunfight-court.test.ts tests/rts-courts.test.ts tests/prison-and-hijack.test.ts tests/rts-law-integration.test.ts tests/rts-law-save-validation.test.ts tests/police-case-ui.test.ts tests/law-politics-outcomes.test.ts tests/live-law.test.ts tests/body-recovery.test.ts tests/building-emergency.test.ts tests/original-witnesses.test.ts tests/original-fbi.test.ts tests/original-fbi-accountant.test.ts tests/fbi-lifecycle.test.ts
      - name: Validate 3D body skinning, wardrobe and settings
        run: npx vitest run tests/visual-style.test.ts tests/character-morphology.test.ts tests/character-wardrobe-garments.test.ts tests/character-wardrobe-material.test.ts

      - name: Validate vehicle, storefront, building and 3D renderer regressions
        run: npx vitest run tests/vehicle-enamel.test.ts tests/vehicle-roll.test.ts tests/vehicle-livery.test.ts tests/vehicle-paint.test.ts tests/sculpt-vehicles.test.ts tests/sculpt-character-retention.test.ts tests/storefront-material.test.ts tests/city-layout.test.ts tests/visual-style.test.ts

      - name: Check live building stays, vehicle routing, purchases, finance and Book regressions
        run: npx vitest run tests/street-building.test.ts tests/street-motion-controls.test.ts tests/vehicle-navigation.test.ts tests/vehicle-choice.test.ts tests/asset-wealth.test.ts tests/finances.test.ts tests/live-city-plan.test.ts tests/render-architecture.test.ts

      - name: Verify beta.12 package and lockfile versions
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $lock = Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          if ($packageVersion -ne '0.3.0-beta.12' -or $lock['version'] -ne $packageVersion -or $lock['packages']['']['version'] -ne $packageVersion) {
            throw "Release version mismatch: package=$packageVersion lock=$($lock['version'])"
          }

      - name: Build Windows installer and portable app
        run: npm run package:win -- --publish never

      - name: Verify both Windows packages and record checksums
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $files = @("release/RTS-gangster-beta-Setup-$version.exe", "release/RTS-gangster-beta-Portable-$version.exe")
          foreach ($file in $files) {
            if (!(Test-Path -LiteralPath $file -PathType Leaf) -or (Get-Item -LiteralPath $file).Length -le 0) {
              throw "Missing or empty package: $file"
            }
          }
          if (@(Get-ChildItem release/RTS-gangster-beta-*.exe -File).Count -ne 2) {
            throw 'Unexpected Windows package count'
          }
          Get-FileHash -Algorithm SHA256 -LiteralPath $files | Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: rts-gangster-beta-windows
          path: release/RTS-gangster-beta-*.exe
          if-no-files-found: error

      - name: Publish Windows packages to a new prerelease
        if: github.event_name == 'workflow_dispatch' && inputs.tag == 'rts-beta-20261128.1' && github.ref == 'refs/heads/rts-development'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          $branchSha = (gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/rts-development" --jq .object.sha).Trim()
          if ($LASTEXITCODE -ne 0 -or $branchSha -ne $env:GITHUB_SHA) {
            throw 'Branch head changed or could not be verified; refusing to publish'
          }
          $notes = "docs/releases/$($env:TAG).md"
          if (!(Test-Path -LiteralPath $notes -PathType Leaf)) { throw "Release notes not found: $notes" }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $files = @("release/RTS-gangster-beta-Setup-$version.exe", "release/RTS-gangster-beta-Portable-$version.exe")
          # Never replace an existing release or move an existing tag.
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; refusing to overwrite it' }
          $existingTag = git ls-remote --tags origin "refs/tags/$($env:TAG)"
          if ($LASTEXITCODE -ne 0 -or $existingTag) { throw 'Tag exists or could not be checked; refusing to publish' }
          gh release create $env:TAG $files --target $env:GITHUB_SHA --prerelease --title "RTS gangster beta $version" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
