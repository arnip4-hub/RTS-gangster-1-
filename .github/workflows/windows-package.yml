name: Windows beta build and tests

on:
  pull_request:
    branches: [rts-development]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional prerelease tag to publish (blank: artifact only)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci


      - name: Check targeting, pricing, skills, map and calendar regressions
        run: npx vitest run tests/target-owner-privacy.test.ts tests/upstream-pricing.test.ts tests/order-skills.test.ts tests/person-names.test.ts tests/map-intel.test.ts tests/planning-selection.test.ts tests/building-outline.test.ts tests/combat-weapons.test.ts tests/order-staffing.test.ts tests/calendar-modes.test.ts tests/continuous-week.test.ts tests/week-scheduling.test.ts tests/hood-selection.test.ts tests/street-guard-patrol.test.ts

      - name: Check RTS investigations, custody, hearings and save compatibility
        run: npx vitest run tests/rts-police-core.test.ts tests/rts-witness-statements.test.ts tests/rts-fbi-cases.test.ts tests/rts-courts.test.ts tests/rts-law-integration.test.ts tests/rts-law-save-validation.test.ts tests/police-case-ui.test.ts tests/law-politics-outcomes.test.ts tests/live-law.test.ts tests/body-recovery.test.ts tests/building-emergency.test.ts tests/original-witnesses.test.ts tests/original-fbi.test.ts tests/original-fbi-accountant.test.ts tests/fbi-lifecycle.test.ts
      - name: Build Windows installer and portable app
        run: npm run package:win -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: rts-gangster-beta-windows
          path: release/RTS-gangster-beta-*.exe
          if-no-files-found: error

      - name: Publish Windows packages to prerelease
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          $notes = "docs/releases/$($env:TAG).md"
          if (!(Test-Path $notes)) { throw "Release notes not found: $notes" }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --target "${{ github.sha }}" --prerelease --title "RTS gangster beta $version" --notes-file $notes
          }
          gh release upload $env:TAG release/RTS-gangster-beta-*.exe --clobber
