name: Windows beta package

on:
  push:
    tags: ['rts-vehicles-*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional prerelease tag to publish (blank: artifact only)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Verify vehicle rendering contracts
        run: npx vitest run tests/vehicle-sprites.test.ts

      - name: Build Windows installer and portable app
        run: npm run package:win -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: rts-gangster-beta-windows
          path: release/RTS-gangster-beta-*.exe
          if-no-files-found: error

      - name: Publish Windows packages to prerelease
        if: github.event_name == 'push' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        shell: pwsh
        run: |
          $notes = "docs/releases/$($env:TAG).md"
          if (!(Test-Path $notes)) { throw "Release notes not found: $notes" }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG release/RTS-gangster-beta-*.exe --target "${{ github.sha }}" --prerelease --title "RTS gangster beta $version" --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw "Release creation failed" }
          } else {
            gh release upload $env:TAG release/RTS-gangster-beta-*.exe --clobber
            if ($LASTEXITCODE -ne 0) { throw "Release upload failed" }
          }
