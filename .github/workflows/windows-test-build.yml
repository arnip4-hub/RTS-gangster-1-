# A manual Windows build for testing the RTS branch. It runs on Windows so
# electron-builder can create the NSIS installer without Wine, and optionally
# attaches both executable formats to a prerelease.
name: Windows test build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Prerelease tag to publish (blank: workflow artifact only)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Check targeting, pricing, skills and map regressions
        run: npx vitest run tests/target-owner-privacy.test.ts tests/upstream-pricing.test.ts tests/order-skills.test.ts tests/person-names.test.ts tests/map-intel.test.ts tests/planning-selection.test.ts tests/building-outline.test.ts tests/combat-weapons.test.ts tests/order-staffing.test.ts

      - name: Package Windows installer and portable app
        run: npm run package:win -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: rts-gangster-beta-windows
          path: release/*.exe
          if-no-files-found: error

      - name: Attach test build to prerelease
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --target "${{ github.sha }}" --prerelease --title "RTS gangster beta" --notes "Windows beta build from ${{ github.ref_name }} at ${{ github.sha }}. See the release page and README for the full feature list."
          }
          gh release upload $env:TAG release/*.exe --clobber
