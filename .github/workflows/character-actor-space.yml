name: Character actor-space regression
on:
  pull_request:
    branches: [rts-development]
    paths:
      - 'src/render/characterMorphology.ts'
      - 'src/render/characterBindSpace.ts'
      - 'src/render/characterWardrobeGarments.ts'
      - 'tests/character-morphology.test.ts'
      - 'tests/character-wardrobe-garments.test.ts'
      - '.github/workflows/character-actor-space.yml'
permissions:
  contents: read
jobs:
  actor-space:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run tests/character-morphology.test.ts tests/character-wardrobe-garments.test.ts
