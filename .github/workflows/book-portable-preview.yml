name: Book portable preview
on:
  push:
    branches: [book-portable-preview]
    paths: ['.github/workflows/book-portable-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/live-organizer.test.ts tests/live-city-plan.test.ts tests/week-quick-navigation.test.ts
      - run: npm run build:release
      - run: node scripts/package-desktop.mjs --win portable --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Give the corrected preview a distinct filename
        run: Rename-Item -Path (Get-Item release/RTS-gangster-beta-Portable-*.exe).FullName -NewName RTS-gangster-Book-Preview-Fixed.exe
      - uses: actions/upload-artifact@v4
        with:
          name: RTS-gangster-Book-preview-Fixed
          path: release/RTS-gangster-Book-Preview-Fixed.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
