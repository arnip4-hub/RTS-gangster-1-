# Publishes the browser version to GitHub Pages on every push to the RTS development branch.
name: Pages

on:
  push:
    branches: [rts-development]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pages-status:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check whether GitHub Pages is enabled
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.html_url' >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is enabled; proceeding with the deployment."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages not configured::Enable Pages at https://github.com/$GITHUB_REPOSITORY/settings/pages and choose GitHub Actions as source; deployment is skipped until then."
          fi

  build:
    needs: pages-status
    if: needs.pages-status.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Check police, property and top-bar navigation regressions
        run: npx vitest run tests/rts-police-core.test.ts tests/live-law.test.ts tests/rts-courts.test.ts tests/building-actions.test.ts tests/building-dispatch.test.ts tests/business-controls.test.ts tests/week-quick-navigation.test.ts

      # Pages serves the site from /<repository name>/.
      - run: npm run build:release
        env:
          OG_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: [pages-status, build]
    if: needs.pages-status.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
