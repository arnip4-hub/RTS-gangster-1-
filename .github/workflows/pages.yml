# Publishes the browser version to GitHub Pages on every push to the RTS development branch.
name: Pages

on:
  push:
    branches: [rts-development]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Check police, property and top-bar navigation regressions
        run: npx vitest run tests/rts-police-core.test.ts tests/live-law.test.ts tests/rts-courts.test.ts tests/building-actions.test.ts tests/building-dispatch.test.ts tests/business-controls.test.ts tests/week-quick-navigation.test.ts

      # Pages serves the site from /<repository name>/.
      - run: npm run build:release
        env:
          OG_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
